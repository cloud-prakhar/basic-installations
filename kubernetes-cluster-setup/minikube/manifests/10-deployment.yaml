# Sample application Deployment for the single-node Minikube cluster.
#
# replicas: 2 on one node is intentional — replicas are scheduled onto nodes
# with capacity, and one node with room for two Pods is valid. You get real
# ReplicaSet behaviour (rolling updates, self-healing, load-balanced Service
# endpoints) without a second machine. You do NOT get node-failure tolerance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: demo
  labels:
    app.kubernetes.io/name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: web
          image: nginx:1.30-alpine    # multi-arch: amd64 + arm64 (Apple Silicon)
          # IfNotPresent is what makes `minikube image load` work: the kubelet
          # uses the image already inside the node instead of pulling from a
          # registry. With `Always` a locally-loaded image is ignored.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
