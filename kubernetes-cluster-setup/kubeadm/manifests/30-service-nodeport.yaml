# NodePort Service — opens a fixed port on EVERY node's IP.
#
# On this single-node cluster that means: http://<NODE_IP>:30080
#
# NodePort ports must be in the range 30000-32767 unless the API server was
# started with a different --service-node-port-range.
#
# Security note: on EC2 this port is only reachable if your security group
# explicitly allows it. Do not open 30000-32767 to 0.0.0.0/0.
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080             # omit this line to let Kubernetes pick one
      protocol: TCP
